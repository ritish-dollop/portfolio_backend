server:
  port: 8080

spring:
  application:
    name: Portfolio_Backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Java@2023}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  cache:
    type: ${SPRING_CACHE_TYPE:redis}
    redis:
      time-to-live: 3600000
      cache-null-values: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:portfolio-admin-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 1500
    listener:
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:ritishd.dollop@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:jllixbwenlulrdyg}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:123456789012345}
  api-secret: ${CLOUDINARY_API_SECRET:abcdefghijklmnopqrstuvwxyz1}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      email: ${ADMIN_BOOTSTRAP_EMAIL:admin@portfolio.com}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:Admin@123456}
      full-name: ${ADMIN_BOOTSTRAP_NAME:Portfolio Administrator}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  socketio:
    enabled: ${SOCKETIO_ENABLED:true}
    host: ${SOCKETIO_HOST:0.0.0.0}
    port: ${SOCKETIO_PORT:9092}
    boss-count: ${SOCKETIO_BOSS_COUNT:1}
    work-count: ${SOCKETIO_WORK_COUNT:100}
    allow-custom-requests: true
    upgrade-timeout: 1000000
    ping-timeout: 60000
    ping-interval: 25000
    max-frame-payload-length: 1048576
    max-http-content-length: 1048576
  notifications:
    seed-on-startup: ${NOTIFICATION_SEED_ON_STARTUP:true}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    otp-topic: ${KAFKA_OTP_TOPIC:admin-otp-topic}



